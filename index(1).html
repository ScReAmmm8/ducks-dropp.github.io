<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Удар по боссу</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 50% 30%, #1d2a4a 0%, #0b1226 70%);
    color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 18px 22px;
    user-select: none;
    overflow: hidden;
  }
  .top { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
  .pill {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 10px 22px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .pill .num { font-size: 40px; font-weight: 800; color: #ffd36b; }
  .pill .lbl { font-size: 16px; color: #9aa6c4; font-weight: 600; }
  .pill.small { padding: 8px 14px; }
  .pill.small .num { font-size: 18px; color: #cfd6e8; }
  h1 { font-size: 26px; text-align: center; margin: 26px 0 6px; }
  .sub { color: #7f8bad; font-size: 16px; text-align: center; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; width: 100%; }
  #duck { width: 230px; height: 230px; transition: transform 0.08s, filter 0.3s; }
  #duck.hit { transform: scale(0.88) rotate(-6deg); }
  #duck.angry { filter: hue-rotate(-25deg) saturate(1.6); animation: shake 0.18s infinite; }
  @keyframes shake {
    0% { margin-left: 0; } 25% { margin-left: -6px; } 75% { margin-left: 6px; } 100% { margin-left: 0; }
  }
  .float {
    position: absolute;
    font-size: 28px;
    font-weight: 800;
    color: #ffd36b;
    pointer-events: none;
    animation: up 0.9s ease-out forwards;
  }
  @keyframes up { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-120px); } }
  .warn {
    width: 100%;
    text-align: center;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #ffd36b;
    margin-bottom: 12px;
  }
  #bey {
    width: 100%;
    margin-top: 18px;
    border: none;
    border-radius: 26px;
    padding: 22px 0;
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #3a2a00;
    background: linear-gradient(#ffd96b, #f6a91c);
    box-shadow: 0 7px 0 #b9760a, 0 14px 30px rgba(246,169,28,0.3);
    transition: transform 0.06s, box-shadow 0.06s;
  }
  #bey:active { transform: translateY(5px); box-shadow: 0 2px 0 #b9760a; }
  #bey:disabled { opacity: 0.6; }
  .note { color: #7f8bad; font-size: 15px; text-align: center; margin-top: 14px; }
</style>
</head>
<body>
  <div class="top">
    <div class="pill"><span class="num" id="balance">0</span><span class="lbl">звёзд</span></div>
    <div class="pill small"><span>🥊</span><span class="num" id="hits">0</span></div>
  </div>

  <h1>Твой первый босс, ударь его!</h1>

  <div class="stage" id="stage">
    <svg id="duck" viewBox="0 0 200 200">
      <ellipse cx="100" cy="178" rx="62" ry="9" fill="rgba(0,0,0,0.35)"/>
      <path d="M40 120 C40 160 70 176 105 176 C150 176 168 150 160 118 C154 98 140 90 120 90 L60 92 C46 96 40 106 40 120 Z" fill="#ffd428" stroke="#f59a0c" stroke-width="6"/>
      <circle cx="100" cy="75" r="52" fill="#ffd428" stroke="#f59a0c" stroke-width="6"/>
      <circle cx="78" cy="68" r="9" fill="#111"/>
      <circle cx="122" cy="68" r="9" fill="#111"/>
      <circle cx="81" cy="64" r="3" fill="#fff"/>
      <circle cx="125" cy="64" r="3" fill="#fff"/>
      <path d="M86 88 C92 80 108 80 114 88 C112 100 88 100 86 88 Z" fill="#e8472b" stroke="#b5301a" stroke-width="3"/>
      <path d="M142 126 C158 132 160 150 146 158" fill="none" stroke="#f59a0c" stroke-width="6" stroke-linecap="round"/>
    </svg>
  </div>

  <button id="bey"></button>

<script>
  var tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  var params = new URLSearchParams(location.search);
  var INVOICE = params.get("inv") || "";
  var PRICE = parseInt(params.get("price") || "500", 10);
  var REWARD = parseInt(params.get("reward") || "5", 10);
  var WARN = params.get("warn") || "Каждый удар = оплата {price} ⭐";

  var state = { balance: 0, hits: 0 };
  var busy = false;
  var lastPress = 0;
  var anger = 0;

  var elBalance = document.getElementById("balance");
  var elHits = document.getElementById("hits");
  var elBey = document.getElementById("bey");
  var elDuck = document.getElementById("duck");
  var elStage = document.getElementById("stage");

  elBey.textContent = "БЕЙ";

  function render() {
    elBalance.textContent = state.balance;
    elHits.textContent = state.hits;
  }

  function localLoad() {
    try {
      return {
        balance: parseInt(localStorage.getItem("balance") || "0", 10) || 0,
        hits: parseInt(localStorage.getItem("hits") || "0", 10) || 0
      };
    } catch (e) {
      return { balance: 0, hits: 0 };
    }
  }

  function loadState(cb) {
    try {
      if (tg.isVersionAtLeast("6.9")) {
        tg.CloudStorage.getItems(["balance", "hits"], function (err, v) {
          if (err || !v) { cb(localLoad()); return; }
          cb({
            balance: parseInt(v.balance || "0", 10) || 0,
            hits: parseInt(v.hits || "0", 10) || 0
          });
        });
        return;
      }
    } catch (e) {}
    cb(localLoad());
  }

  function saveState() {
    try {
      localStorage.setItem("balance", String(state.balance));
      localStorage.setItem("hits", String(state.hits));
    } catch (e) {}
    try {
      if (tg.isVersionAtLeast("6.9")) {
        tg.CloudStorage.setItem("balance", String(state.balance));
        tg.CloudStorage.setItem("hits", String(state.hits));
      }
    } catch (e) {}
  }

  function popup(text) {
    var d = document.createElement("div");
    d.className = "float";
    d.textContent = text;
    d.style.left = (40 + Math.random() * 40) + "%";
    d.style.top = "35%";
    elStage.appendChild(d);
    setTimeout(function () { d.remove(); }, 950);
  }

  function updateAnger() {
    var now = Date.now();
    if (lastPress && now - lastPress < 1000) {
      anger = Math.min(anger + 1, 5);
    } else {
      anger = Math.max(anger - 1, 0);
    }
    lastPress = now;
    if (anger >= 2) elDuck.classList.add("angry");
    else elDuck.classList.remove("angry");
  }

  setInterval(function () {
    if (lastPress && Date.now() - lastPress > 3000 && anger > 0) {
      anger = 0;
      elDuck.classList.remove("angry");
    }
  }, 1000);

  function onPaid() {
    state.balance += REWARD;
    state.hits += 1;
    saveState();
    render();
    popup("+" + REWARD);
    elDuck.classList.add("hit");
    setTimeout(function () { elDuck.classList.remove("hit"); }, 120);
    try { tg.HapticFeedback.impactOccurred(anger >= 2 ? "heavy" : "light"); } catch (e) {}
  }

  elBey.addEventListener("click", function () {
    if (busy) return;
    if (!INVOICE) {
      tg.showAlert("Оплата не настроена. Открой игру через бота командой /start.");
      return;
    }
    busy = true;
    elBey.disabled = true;
    updateAnger();
    tg.openInvoice(INVOICE, function (status) {
      busy = false;
      elBey.disabled = false;
      if (status === "paid") onPaid();
    });
  });

  loadState(function (s) {
    state = s;
    render();
  });
</script>
</body>
</html>
